# E2E Tests for analytics-next (Node.js SDK)
# Copy this file to: analytics-next/.github/workflows/e2e-tests.yml
#
# This workflow:
# 1. Checks out the SDK and sdk-e2e-tests repos
# 2. Builds the SDK monorepo and e2e-cli
# 3. Runs the e2e test suite

name: E2E Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      e2e_tests_ref:
        description: 'Branch or ref of sdk-e2e-tests to use'
        required: false
        default: 'main'

jobs:
  # A suite E2E vive em segmentio/sdk-e2e-tests (repo privado da Segment).
  # Sem E2E_TESTS_TOKEN o checkout falha e derruba o workflow. O secrets
  # context não existe no `if` de job, então a checagem vira um job próprio.
  check-e2e-token:
    runs-on: ubuntu-latest
    outputs:
      has-token: ${{ steps.check.outputs.has-token }}
    steps:
      - id: check
        env:
          E2E_TESTS_TOKEN: ${{ secrets.E2E_TESTS_TOKEN }}
        run: |
          if [ -n "$E2E_TESTS_TOKEN" ]; then
            echo "has-token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::E2E_TESTS_TOKEN ausente — E2E ignorado (requer acesso a segmentio/sdk-e2e-tests)."
          fi

  e2e-tests:
    needs: check-e2e-token
    # Skip on fork PRs where repo secrets aren't available
    if: ${{ needs.check-e2e-token.outputs.has-token == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SDK
        uses: actions/checkout@v4
        with:
          path: sdk

      - name: Checkout sdk-e2e-tests
        uses: actions/checkout@v4
        with:
          repository: segmentio/sdk-e2e-tests
          ref: ${{ inputs.e2e_tests_ref || 'main' }}
          token: ${{ secrets.E2E_TESTS_TOKEN }}
          path: sdk-e2e-tests

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install SDK dependencies
        working-directory: sdk
        run: yarn install

      - name: Build SDK packages
        working-directory: sdk
        run: yarn build

      - name: Build e2e-cli
        working-directory: sdk/packages/node/e2e-cli
        run: |
          npm install
          npm run build

      - name: Run E2E tests
        working-directory: sdk-e2e-tests
        run: |
          ./scripts/run-tests.sh \
            --sdk-dir "${{ github.workspace }}/sdk/packages/node/e2e-cli" \
            --cli "node ${{ github.workspace }}/sdk/packages/node/e2e-cli/dist/cli.js"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: sdk-e2e-tests/test-results/
          if-no-files-found: ignore
